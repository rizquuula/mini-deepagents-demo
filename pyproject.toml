[project]
name = "mini-deepagents"
version = "0.1.0"
description = "Minimal web chat with an 8K-token context cap."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src/backend"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
