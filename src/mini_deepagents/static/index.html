<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mini-deepagents</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --surface: #ffffff;
    --surface-alt: #eef0f3;
    --text: #1b1d21;
    --text-muted: #5b616b;
    --border: #d5d9df;
    --primary: #2457c5;
    --on-primary: #ffffff;
    --user-bg: #dde7fb;
    --error-bg: #fde8e8;
    --error-text: #9b1c1c;
    --focus: #2457c5;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-6: 24px;
    --radius-s: 8px;
    --radius-m: 12px;
    --font-body: 15px;
    --font-small: 13px;
    --font-title: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17191d;
      --surface: #202328;
      --surface-alt: #2a2e35;
      --text: #eceef1;
      --text-muted: #a3a9b3;
      --border: #3a3f47;
      --primary: #8fb0f5;
      --on-primary: #10141c;
      --user-bg: #263a5e;
      --error-bg: #4a2224;
      --error-text: #ffc9c9;
      --focus: #8fb0f5;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: var(--font-body)/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .layout {
    display: grid;
    grid-template-columns: 260px minmax(0, 1fr);
    height: 100vh;
    height: 100dvh;
  }
  .sidebar {
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
    padding: var(--space-4);
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
  }
  .sidebar h1 { font-size: var(--font-title); margin: 0; }
  .session-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-1); }
  .session-button {
    width: 100%;
    min-height: 44px;
    padding: var(--space-2) var(--space-3);
    text-align: left;
    background: transparent;
    color: var(--text);
    border: 1px solid transparent;
    border-radius: var(--radius-s);
    font: inherit;
    cursor: pointer;
  }
  .session-button:hover { background: var(--surface-alt); }
  .session-button[aria-current="true"] { background: var(--surface-alt); border-color: var(--primary); }
  .session-label { display: block; font-weight: 600; }
  .session-date { display: block; font-size: var(--font-small); color: var(--text-muted); }
  .chat { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: var(--space-6) var(--space-4);
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
  }
  .message {
    max-width: min(720px, 100%);
    padding: var(--space-3) var(--space-4);
    border-radius: var(--radius-m);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .message-user { align-self: flex-end; background: var(--user-bg); }
  .message-assistant { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); }
  .message-pending { color: var(--text-muted); font-style: italic; }
  .message-error { align-self: stretch; background: var(--error-bg); color: var(--error-text); }
  .role { display: block; font-size: var(--font-small); font-weight: 600; color: var(--text-muted); margin-bottom: var(--space-1); }
  .message-error .role { color: var(--error-text); }
  .empty-state { margin: auto; text-align: center; color: var(--text-muted); }
  .composer {
    display: flex;
    gap: var(--space-2);
    padding: var(--space-3) var(--space-4) calc(var(--space-3) + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border);
    background: var(--surface);
  }
  .composer textarea {
    flex: 1;
    min-width: 0;
    min-height: 44px;
    max-height: 200px;
    resize: vertical;
    padding: var(--space-2) var(--space-3);
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius-s);
    font: inherit;
  }
  .button {
    min-height: 44px;
    padding: 0 var(--space-4);
    background: var(--primary);
    color: var(--on-primary);
    border: none;
    border-radius: var(--radius-s);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .button:disabled { opacity: 0.6; cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }
  @media (max-width: 639px) {
    .layout { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
    .sidebar { border-right: none; border-bottom: 1px solid var(--border); max-height: 35vh; }
  }
</style>
</head>
<body>
<div class="layout">
  <nav class="sidebar" aria-label="Chat sessions">
    <h1>mini-deepagents</h1>
    <button type="button" class="button" id="new-chat">New chat</button>
    <ul class="session-list" id="session-list"></ul>
  </nav>
  <main class="chat">
    <div class="messages" id="messages" aria-live="polite"></div>
    <form class="composer" id="composer">
      <label for="input" class="visually-hidden">Message</label>
      <textarea id="input" rows="2" placeholder="Type a message. Enter sends, Shift+Enter adds a new line."></textarea>
      <button type="submit" class="button" id="send">Send</button>
    </form>
  </main>
</div>
<script>
(() => {
  "use strict";

  const TOO_LONG_TEXT = "Message is too long for the 8K context window.";
  const sessionListEl = document.getElementById("session-list");
  const messagesEl = document.getElementById("messages");
  const formEl = document.getElementById("composer");
  const inputEl = document.getElementById("input");
  const sendEl = document.getElementById("send");
  const newChatEl = document.getElementById("new-chat");

  let sessions = [];
  let activeId = null;
  let isPending = false;

  class ApiError extends Error {
    constructor(status, detail) {
      super(detail);
      this.status = status;
    }
  }

  async function api(method, path, body) {
    const options = { method, headers: {} };
    if (body !== undefined) {
      options.headers["Content-Type"] = "application/json";
      options.body = JSON.stringify(body);
    }
    const response = await fetch(path, options);
    const data = await response.json().catch(() => null);
    if (!response.ok) {
      throw new ApiError(response.status, errorText(response.status, data));
    }
    return data;
  }

  function errorText(status, data) {
    if (status === 413) return TOO_LONG_TEXT;
    if (data && typeof data.detail === "string") return data.detail;
    if (data && Array.isArray(data.detail)) return "The request is not valid.";
    return `Request failed (status ${status}).`;
  }

  function renderSessions() {
    sessionListEl.replaceChildren();
    for (const session of sessions) {
      const item = document.createElement("li");
      const button = document.createElement("button");
      button.type = "button";
      button.className = "session-button";
      button.setAttribute("aria-current", String(session.id === activeId));
      const label = document.createElement("span");
      label.className = "session-label";
      label.textContent = `Chat #${session.id}`;
      const date = document.createElement("span");
      date.className = "session-date";
      date.textContent = session.created_at;
      button.append(label, date);
      button.addEventListener("click", () => openSession(session.id));
      item.append(button);
      sessionListEl.append(item);
    }
  }

  function messageElement(kind, roleText, text) {
    const el = document.createElement("div");
    el.className = `message message-${kind}`;
    const role = document.createElement("span");
    role.className = "role";
    role.textContent = roleText;
    const body = document.createElement("span");
    body.textContent = text;
    el.append(role, body);
    return el;
  }

  function appendMessage(message) {
    const isUser = message.role === "user";
    const el = messageElement(isUser ? "user" : "assistant", isUser ? "You" : "Assistant", message.content);
    messagesEl.append(el);
    return el;
  }

  function showEmptyState(text) {
    const el = document.createElement("p");
    el.className = "empty-state";
    el.textContent = text;
    messagesEl.replaceChildren(el);
  }

  function showError(text) {
    messagesEl.querySelector(".empty-state")?.remove();
    const el = messageElement("error", "Error", text);
    el.setAttribute("role", "alert");
    messagesEl.append(el);
    scrollToEnd();
  }

  function scrollToEnd() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function loadSessions() {
    sessions = await api("GET", "/api/sessions");
  }

  async function openSession(id) {
    activeId = id;
    renderSessions();
    try {
      const messages = await api("GET", `/api/sessions/${id}/messages`);
      if (activeId !== id) return;
      if (messages.length === 0) {
        showEmptyState("No messages yet. Type a message to start.");
        return;
      }
      messagesEl.replaceChildren();
      messages.forEach(appendMessage);
      scrollToEnd();
    } catch (error) {
      messagesEl.replaceChildren();
      showError(error.message);
    }
  }

  async function createSession() {
    const session = await api("POST", "/api/sessions");
    sessions.unshift(session);
    await openSession(session.id);
    return session.id;
  }

  function setPending(value) {
    isPending = value;
    sendEl.disabled = value;
    messagesEl.setAttribute("aria-busy", String(value));
  }

  async function sendMessage() {
    const content = inputEl.value;
    if (isPending || content.trim() === "") return;
    setPending(true);
    const placeholder = messageElement("assistant message-pending", "Assistant", "Thinking…");
    try {
      const sessionId = activeId ?? (await createSession());
      messagesEl.querySelector(".empty-state")?.remove();
      messagesEl.append(placeholder);
      scrollToEnd();
      const data = await api("POST", `/api/sessions/${sessionId}/messages`, { content });
      placeholder.remove();
      if (activeId === sessionId) {
        appendMessage({ role: "user", content });
        appendMessage({ role: "assistant", content: data.reply });
        scrollToEnd();
      }
      inputEl.value = "";
    } catch (error) {
      placeholder.remove();
      showError(error.message);
    } finally {
      setPending(false);
      inputEl.focus();
    }
  }

  formEl.addEventListener("submit", (event) => {
    event.preventDefault();
    sendMessage();
  });

  inputEl.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
      event.preventDefault();
      sendMessage();
    }
  });

  newChatEl.addEventListener("click", async () => {
    try {
      await createSession();
      inputEl.focus();
    } catch (error) {
      showError(error.message);
    }
  });

  async function init() {
    try {
      await loadSessions();
    } catch (error) {
      showError(error.message);
      return;
    }
    renderSessions();
    if (sessions.length === 0) {
      showEmptyState("No chats yet. Click \"New chat\" or type a message to start a new chat.");
      return;
    }
    await openSession(sessions[0].id);
  }

  init();
})();
</script>
</body>
</html>
